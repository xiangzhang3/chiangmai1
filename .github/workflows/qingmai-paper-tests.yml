name: qingmai-paper-tests
on:
  push:
    paths:
      - 'v1.0/**'
      - '.github/workflows/qingmai-paper-tests.yml'
  pull_request:
    paths:
      - 'v1.0/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
