name: Xiaoha JCT Paper Engine
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/xiaoha-jct-paper.yml'
permissions:
  contents: write
concurrency:
  group: xiaoha-jct-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r v1.0/requirements.txt
      - name: Run tests
        working-directory: v1.0
        run: python -m unittest discover -s tests
      - name: Run paper engine
        working-directory: v1.0
        run: python -m qingmai.paper_runner
      - name: Persist verified ledger or health status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1.0/qingmai/sim_accounts/JCT-A01.json v1.0/qingmai/sim_accounts/JCT-A01-health.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: xiaoha JCT paper snapshot [skip ci]"
            git push
          fi
