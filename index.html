<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>清迈1号 · 模拟盘 & 合约雷达</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--tx:#e6edf3;--mut:#8b949e;--g:#3fb950;--r:#f85149;--y:#d29922;--b:#58a6ff;--m:#bc8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
.wrap{max-width:1280px;margin:auto;padding:20px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:26px 0 10px;color:var(--tx)}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .k{color:var(--mut);font-size:12px}.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--mut);font-weight:500}
th:first-child,td:first-child{text-align:left}
.pos{color:var(--g)}.neg{color:var(--r)}.mut{color:var(--mut)}b.hl{color:#ffd33d}
.bar{position:relative;height:22px;background:#21262d;border-radius:6px;margin:6px 0 24px}
.bar .fill{position:absolute;top:0;bottom:0;border-radius:6px}.bar .z{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tx)}
.bar .sl,.bar .tp{position:absolute;top:26px;font-size:11px;opacity:.8}.prow{display:flex;justify-content:space-between;font-size:13px}
.q{border-left:4px solid}.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;margin-left:6px;background:#21262d}
.foot{color:var(--mut);font-size:12px;margin:30px 0 10px;text-align:center}
</style></head><body><div class="wrap">
<h1>清迈1号 · 模拟盘 & 币安合约雷达</h1><div class="sub" id="upd">加载中…</div>
<div class="kpis" id="kpis"></div>
<div class="grid2"><div><h2>账户权益曲线</h2><div class="card"><canvas id="eq" height="140"></canvas></div></div>
<div><h2>持仓进度 <span class="mut" style="font-size:12px">止损 −10% ← 入场 → 止盈 +5%</span></h2><div class="card" id="bars"></div></div></div>
<h2>当前持仓</h2><div class="card"><table id="t_open"></table></div>
<h2>历史成交</h2><div class="card"><table id="t_closed"></table></div>
<h2>合约雷达四象限</h2><div class="sub" id="rsub"></div>
<div class="card" style="margin-top:10px"><canvas id="sc" height="130"></canvas></div>
<div id="quads"></div>
<div class="foot">仅供研究 · 模拟盘，不涉及真实交易 · 数据来源：币安 U 本位永续公开接口 · 页面每 5 分钟自动刷新</div>
</div><script>
const TP=5,SL=10,C={g:"#3fb950",r:"#f85149",y:"#d29922",b:"#58a6ff",m:"#bc8cff"};
const f=(v,d=2)=>v==null?"—":(+v).toFixed(d), sg=(v,d=2)=>v==null?"—":((v>0?"+":"")+(+v).toFixed(d)), usd=v=>"$"+Math.round(v).toLocaleString();
const cls=v=>v>0?"pos":v<0?"neg":"", px=v=>v==null?"—":(+v).toPrecision(6).replace(/\.?0+$/,"");
const nm=s=>s.replace(/USDT$/,""), sigCN={PRE_MOVE:"预启动",IGNITION:"点火",DELEVERAGING:"去杠杆",RISK_DIVERGENCE:"风险背离"};
function color(x){const fr=Math.abs((x.funding_rate||0)*100),a=x.volume_acceleration||0,p2=Math.abs(x.price_2h_pct||0),o2=Math.abs(x.oi_2h_pct||0),t=x.taker_ratio;
 if((x.signal&&x.signal!="WATCH")||p2>5||o2>10||a>=3||fr>=0.05)return"🔴";
 if(o2>3||p2>3||a>=1.5||t>=1.3||t<=0.75||fr>=0.02||(x.funding_rate||0)<0)return"🟡";return"🟢"}
let charts={};
async function load(){
 const bust="?t="+Date.now();
 const [L,D]=await Promise.all([fetch("qingmai_paper.json"+bust).then(r=>r.json()),fetch("qingmai_last.json"+bust).then(r=>r.json())]);
 const s=L.log[L.log.length-1], held=new Set(L.open.map(p=>p.symbol));
 document.getElementById("upd").textContent=`最后更新：${s.time}（曼谷时间） · 初始资金 ${usd(L.capital)} · 每笔 $10,000 · 1 倍杠杆 · 最多 5 笔`;
 const upnl=L.open.reduce((a,p)=>a+p.notional*(p.upnl_pct||0)/100,0);
 const k=[["账户权益",usd(s.equity),s.return_pct],["总收益率",sg(s.return_pct)+"%",s.return_pct],["已实现盈亏",(s.realized>=0?"+":"")+usd(s.realized),s.realized],
  ["浮动盈亏",(upnl>=0?"+":"")+usd(upnl),upnl],["胜率",s.win_rate==null?"—":Math.round(s.win_rate*100)+"%",0],["已平仓",s.closed+" 笔",0],["持仓",s.open+" / 5",0]];
 document.getElementById("kpis").innerHTML=k.map(([a,b,c])=>`<div class="kpi"><div class="k">${a}</div><div class="v ${cls(c)}">${b}</div></div>`).join("");
 // 权益曲线
 charts.eq&&charts.eq.destroy();
 charts.eq=new Chart(eq,{type:"line",data:{labels:L.log.map(x=>x.time.slice(5)),datasets:[{data:L.log.map(x=>x.equity),borderColor:C.b,backgroundColor:"rgba(88,166,255,.15)",fill:true,tension:.25,pointRadius:3},
  {data:L.log.map(()=>L.capital),borderColor:"#8b949e",borderDash:[5,5],pointRadius:0}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#8b949e"},grid:{color:"#30363d"}},y:{ticks:{color:"#8b949e",callback:v=>"$"+v.toLocaleString()},grid:{color:"#30363d"}}}}});
 // 进度条
 bars.innerHTML=L.open.length?L.open.map(p=>{const u=p.upnl_pct||0,w=SL+TP,z=SL/w*100,cl=Math.max(-SL,Math.min(TP,u)),
  l=cl>=0?z:z+cl/w*100,wd=Math.abs(cl)/w*100;
  return`<div class="prow"><b>★ ${nm(p.symbol)} <span class="${p.side=="long"?"pos":"neg"}">${p.side=="long"?"做多":"做空"}</span></b><span class="${cls(u)}">${sg(u)}% · ${(u>=0?"+":"")+usd(p.notional*u/100)}</span></div>
  <div class="bar"><span class="sl neg" style="left:0">止损 −10%</span><span class="tp pos" style="right:0">止盈 +5%</span><div class="fill" style="left:${l}%;width:${wd}%;background:${u>=0?C.g:C.r}"></div><div class="z" style="left:${z}%"></div></div>`}).join(""):`<div class="mut" style="padding:30px;text-align:center">当前空仓</div>`;
 // 持仓表
 document.getElementById("t_open").innerHTML=`<tr><th>币种</th><th>方向</th><th>入场价</th><th>现价</th><th>止盈价</th><th>止损价</th><th>浮盈</th><th>开仓时间</th><th>开仓原因</th></tr>`+
  (L.open.map(p=>{const d=p.side=="long"?1:-1,w=p.why||{};return`<tr><td><b class="hl">★ ${nm(p.symbol)}</b></td><td class="${d>0?"pos":"neg"}">${d>0?"做多":"做空"}</td><td>${px(p.entry)}</td><td>${px(p.mark||p.entry)}</td>
  <td class="pos">${px(p.entry*(1+d*TP/100))}</td><td class="neg">${px(p.entry*(1-d*SL/100))}</td><td class="${cls(p.upnl_pct)}"><b>${sg(p.upnl_pct||0)}%</b></td><td>${p.entry_time}</td>
  <td>${sigCN[w.signal]||"趋势条件"} · 2h ${sg(w.p2h)}% · OI24h ${sg(w.oi24)}% · 量 ${f(w.acc)}x</td></tr>`}).join("")||`<tr><td colspan=9 class="mut">无</td></tr>`);
 document.getElementById("t_closed").innerHTML=`<tr><th>币种</th><th>方向</th><th>入场价</th><th>平仓价</th><th>盈亏</th><th>盈亏%</th><th>开仓</th><th>平仓</th><th>原因</th></tr>`+
  (L.closed.slice().reverse().map(c=>`<tr><td>${nm(c.symbol)}</td><td class="${c.side=="long"?"pos":"neg"}">${c.side=="long"?"做多":"做空"}</td><td>${px(c.entry)}</td><td>${px(c.exit)}</td>
  <td class="${cls(c.pnl)}">${(c.pnl>=0?"+":"")+usd(c.pnl)}</td><td class="${cls(c.pnl_pct)}">${sg(c.pnl_pct)}%</td><td>${c.entry_time}</td><td>${c.exit_time}</td><td>${c.reason}</td></tr>`).join("")||`<tr><td colspan=9 class="mut">还没有平仓的交易</td></tr>`);
 // 雷达
 const Q=[["price_up_oi_up","🚀 价涨 + OI涨 · 新多进场",C.g],["price_down_oi_up","⚠️ 价跌 + OI涨 · 空头加仓/抄底，易轧空",C.y],["price_down_oi_down","🔻 价跌 + OI跌 · 去杠杆",C.r],["price_up_oi_down","🌀 价涨 + OI跌 · 空头回补，可能不持久",C.m]];
 let nr=0,ny=0;Q.forEach(([k])=>D.quadrants[k].top.forEach(x=>{const c=color(x);if(c=="🔴")nr++;if(c=="🟡")ny++}));
 rsub.textContent=`扫描 ${D.total_usdt_perps} 个 U 本位永续 · 流动性达标 ${D.liquid_perps} 个（24h 成交额 ≥ 200 万 USDT，|OI 24h| ≥ 5%）· 每象限按 |OI 24h| 取前 5 · 本轮 🔴 ${nr} 个、🟡 ${ny} 个 · ★ = 当前持仓`;
 const sl=v=>Math.sign(v)*Math.log10(1+Math.abs(v));
 charts.sc&&charts.sc.destroy();
 charts.sc=new Chart(sc,{type:"bubble",data:{datasets:Q.map(([k,l,c])=>({label:l.slice(2),backgroundColor:c+"bb",borderColor:"#fff",borderWidth:1,
  data:D.quadrants[k].top.filter(x=>!x.error).map(x=>({x:sl(x.price_24h_pct),y:sl(x.oi_24h_pct_rank),r:5+Math.min(x.volume_acceleration||0,8)*2.2,n:nm(x.symbol),p:x.price_24h_pct,o:x.oi_24h_pct_rank,h:held.has(x.symbol)}))}))},
  options:{plugins:{legend:{labels:{color:"#e6edf3"}},tooltip:{callbacks:{label:c=>`${c.raw.h?"★":""}${c.raw.n}  24h ${sg(c.raw.p)}%  OI24h ${sg(c.raw.o)}%`}}},
  scales:{x:{title:{display:true,text:"24h 价格涨跌（对数刻度）",color:"#8b949e"},ticks:{color:"#8b949e",callback:v=>sg(Math.sign(v)*(10**Math.abs(v)-1),0)+"%"},grid:{color:"#30363d"}},
          y:{title:{display:true,text:"24h OI 变化（对数刻度）",color:"#8b949e"},ticks:{color:"#8b949e",callback:v=>sg(Math.sign(v)*(10**Math.abs(v)-1),0)+"%"},grid:{color:"#30363d"}}}},
  plugins:[{id:"lbl",afterDatasetsDraw(ch){const g=ch.ctx;g.save();g.font="11px sans-serif";ch.data.datasets.forEach((d,i)=>ch.getDatasetMeta(i).data.forEach((pt,j)=>{const r=d.data[j];g.fillStyle=r.h?"#ffd33d":"#e6edf3";g.fillText((r.h?"★":"")+r.n,pt.x+pt.options.radius+3,pt.y-3)}));g.restore()}}]});
 quads.innerHTML=Q.map(([k,l,c])=>{const q=D.quadrants[k];return`<h2>${l} <span class="mut" style="font-size:12px">共 ${q.count_in_quadrant} 个</span></h2><div class="card q" style="border-left-color:${c}"><table>
  <tr><th>币种</th><th>价格</th><th>24h</th><th>2h</th><th>OI 2h</th><th>OI 24h</th><th>量加速</th><th>买卖比</th><th>资金费率</th><th>现货量加速</th><th>合约/现货</th><th>信号</th></tr>`+
  q.top.map(x=>x.error?`<tr><td>${nm(x.symbol)}</td><td colspan=11 class="mut">数据获取失败</td></tr>`:`<tr><td>${color(x)} ${held.has(x.symbol)?'<b class="hl">★'+nm(x.symbol)+'</b>':'<b>'+nm(x.symbol)+'</b>'}</td><td>${px(x.price)}</td>
  <td class="${cls(x.price_24h_pct)}">${sg(x.price_24h_pct)}%</td><td class="${cls(x.price_2h_pct)}">${sg(x.price_2h_pct)}%</td><td class="${cls(x.oi_2h_pct)}">${sg(x.oi_2h_pct)}%</td><td class="${cls(x.oi_24h_pct_rank)}">${sg(x.oi_24h_pct_rank,1)}%</td>
  <td>${f(x.volume_acceleration)}x</td><td>${f(x.taker_ratio)}</td><td class="${cls(x.funding_rate)}">${sg(x.funding_rate*100,3)}%</td><td>${x.spot_volume_acceleration==null?"—":f(x.spot_volume_acceleration)+"x"}</td>
  <td>${x.futures_to_spot_ratio==null?"—":f(x.futures_to_spot_ratio,1)+"x"}</td><td>${x.signal&&x.signal!="WATCH"?'<span class="tag neg">'+(sigCN[x.signal]||x.signal)+'</span>':'<span class="mut">观察</span>'}</td></tr>`).join("")+`</table></div>`}).join("");
}
load().catch(e=>upd.textContent="数据加载失败："+e);setInterval(()=>load().catch(()=>{}),300000);
</script></body></html>
